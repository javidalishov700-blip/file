name: PDFStudio
options:
  bundleIdPrefix: com.javidalishov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PDFStudio:
    type: application
    platform: iOS
    sources:
      - path: PDFStudio
    settings:
      base:
        PRODUCT_NAME: PDFStudio
        PRODUCT_BUNDLE_IDENTIFIER: com.javidalishov.pdfstudio
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer Team ID here (or pick it in Xcode > Signing & Capabilities)
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES

schemes:
  PDFStudio:
    build:
      targets:
        PDFStudio: all
    run:
      config: Debug
    archive:
      config: Release
